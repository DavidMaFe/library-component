<label class="root">
  <input
    class="native"
    type="checkbox"
    role="switch"
    [id]="inputId"
    [checked]="value()"
    [disabled]="isDisabled()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="invalid() || null"
    (change)="onToggle($event)"
    (blur)="onBlur()"
  />
  <span class="track" aria-hidden="true"><span class="thumb"></span></span>
  <span class="text"><ng-content /></span>
</label>
