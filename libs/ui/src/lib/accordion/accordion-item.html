<div class="heading" role="heading" [attr.aria-level]="headingLevel()">
  <button
    type="button"
    class="trigger"
    [id]="triggerId"
    [attr.aria-expanded]="item.expanded"
    [attr.aria-controls]="panelId"
    [disabled]="item.disabled"
    (click)="item.toggle()"
  >
    <span class="title">{{ heading() }}</span>
    <span class="chevron-wrap" aria-hidden="true">
      <svg class="chevron" viewBox="0 0 24 24" focusable="false">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </span>
  </button>
</div>
<div
  class="panel"
  role="region"
  [id]="panelId"
  [attr.aria-labelledby]="triggerId"
  [hidden]="!item.expanded"
>
  <div class="content"><ng-content /></div>
</div>
