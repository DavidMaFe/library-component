<lc-dialog-panel
  data-lc-theme="dark"
  size="lg"
  [heading]="labels.galleryCounter(index() + 1, total)"
  [closeLabel]="labels.galleryClose"
>
  <figure class="figure">
    <img class="photo" [src]="photo().src" [alt]="photo().alt" />
    @if (photo().caption) {
    <figcaption class="caption">{{ photo().caption }}</figcaption>
    }
  </figure>

  @if (total > 1) {
  <div lcDialogActions class="nav">
    <button
      lc-icon-button
      variant="secondary"
      shape="round"
      [label]="labels.galleryPrevious"
      (click)="previous()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M10 3L5 8l5 5" />
      </svg>
    </button>
    <button
      lc-icon-button
      variant="secondary"
      shape="round"
      [label]="labels.galleryNext"
      (click)="next()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M6 3l5 5-5 5" />
      </svg>
    </button>
  </div>
  }
</lc-dialog-panel>
